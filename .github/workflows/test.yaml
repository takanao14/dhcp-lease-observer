name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.25.x"
          - "1.26.x"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
      - name: Run Go tests
        run: go test ./...

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum
      - name: Run race tests
        run: go test -race ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Fuzz IX2106 lease parser
        run: go test ./internal/parser/ix2106 -run '^$' -fuzz '^FuzzParseLease$' -fuzztime 10s
      - name: Fuzz IX2106 ARP parser
        run: go test ./internal/parser/ix2106 -run '^$' -fuzz '^FuzzParseARP$' -fuzztime 10s
      - name: Fuzz state diff
        run: go test ./internal/state -run '^$' -fuzz '^FuzzDiff$' -fuzztime 10s
